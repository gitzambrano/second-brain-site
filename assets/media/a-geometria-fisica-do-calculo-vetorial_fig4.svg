<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1150 440">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14px; }
      .subcard { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 10px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .formula { font-family: "DejaVu Sans", "Lucida Console", monospace, sans-serif; font-size: 14px; font-weight: 700; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #64748b; }
    </style>
    <marker id="arr-out" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-shear" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1150" height="440" class="bg"/>
  <rect x="20" y="20" width="1110" height="400" class="card"/>
  <text x="50" y="55" class="title">Divergência: Fonte, Sumidouro e Incompressibilidade</text>

  <!-- ================= PANEL 1: FONTE ================= -->
  <g transform="translate(50, 80)">
    <rect width="340" height="315" class="subcard"/>
    <rect x="20" y="16" width="95" height="22" rx="5" fill="#fef2f2"/>
    <text x="67" y="32" text-anchor="middle" class="badge-text" fill="#dc2626">∇ · u &gt; 0</text>
    <text x="20" y="62" class="card-title" fill="#dc2626">Fonte (Expansão)</text>
    <text x="20" y="84" class="formula" fill="#0f172a">∮_∂V u · n̂ dS &gt; 0</text>

    <g transform="translate(170, 185)">
      <!-- Caixa original antes da expansão -->
      <rect x="-30" y="-30" width="60" height="60" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- Caixa expandida -->
      <rect x="-52" y="-52" width="104" height="104" rx="6" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-width="2.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="DejaVu Sans, monospace" font-size="13" font-weight="700" fill="#dc2626">V(t)</text>
      <!-- Vetores radiais de saída -->
      <line x1="0" y1="-52" x2="0" y2="-84" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-out)"/>
      <line x1="0" y1="52" x2="0" y2="84" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-out)"/>
      <line x1="-52" y1="0" x2="-84" y2="0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-out)"/>
      <line x1="52" y1="0" x2="84" y2="0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-out)"/>
    </g>
    <text x="170" y="295" text-anchor="middle" class="caption">Volume em expansão líquida</text>
  </g>

  <!-- ================= PANEL 2: SUMIDOURO ================= -->
  <g transform="translate(415, 80)">
    <rect width="340" height="315" class="subcard"/>
    <rect x="20" y="16" width="95" height="22" rx="5" fill="#f0f9ff"/>
    <text x="67" y="32" text-anchor="middle" class="badge-text" fill="#0284c7">∇ · u &lt; 0</text>
    <text x="20" y="62" class="card-title" fill="#0284c7">Sumidouro (Compressão)</text>
    <text x="20" y="84" class="formula" fill="#0f172a">∮_∂V u · n̂ dS &lt; 0</text>

    <g transform="translate(170, 185)">
      <!-- Caixa original maior -->
      <rect x="-52" y="-52" width="104" height="104" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- Caixa comprimida -->
      <rect x="-28" y="-28" width="56" height="56" rx="4" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-width="2.2"/>
      <text x="0" y="5" text-anchor="middle" font-family="DejaVu Sans, monospace" font-size="13" font-weight="700" fill="#0284c7">V(t)</text>
      <!-- Vetores radiais de entrada -->
      <line x1="0" y1="-84" x2="0" y2="-56" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-in)"/>
      <line x1="0" y1="84" x2="0" y2="56" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-in)"/>
      <line x1="-84" y1="0" x2="-56" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-in)"/>
      <line x1="84" y1="0" x2="56" y2="0" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr-in)"/>
    </g>
    <text x="170" y="295" text-anchor="middle" class="caption">Volume em contração líquida</text>
  </g>

  <!-- ================= PANEL 3: INCOMPRESSÍVEL ================= -->
  <g transform="translate(780, 80)">
    <rect width="340" height="315" class="subcard"/>
    <rect x="20" y="16" width="95" height="22" rx="5" fill="#faf5ff"/>
    <text x="67" y="32" text-anchor="middle" class="badge-text" fill="#7c3aed">∇ · u = 0</text>
    <text x="20" y="62" class="card-title" fill="#7c3aed">Incompressível (Isochórico)</text>
    <text x="20" y="84" class="formula" fill="#0f172a">∂u/∂x = −∂v/∂y</text>

    <g transform="translate(170, 185)">
      <!-- Quadrado original tracejado (A0 = 70 x 70 = 4900) -->
      <rect x="-35" y="-35" width="70" height="70" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>

      <!-- Retângulo deformado de MESMA área (112 x 43.75 = 4900) -->
      <rect x="-56" y="-22" width="112" height="44" rx="5" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="DejaVu Sans, monospace" font-size="13" font-weight="700" fill="#7c3aed">A₁ = A₀</text>

      <!-- Compressão vertical (setas para dentro sem sobreposição com nenhum texto) -->
      <line x1="0" y1="-72" x2="0" y2="-28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-shear)"/>
      <line x1="0" y1="72" x2="0" y2="28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-shear)"/>

      <!-- Expansão horizontal (setas para fora) -->
      <line x1="-35" y1="0" x2="-80" y2="0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-shear)"/>
      <line x1="35" y1="0" x2="80" y2="0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr-shear)"/>
    </g>
    <text x="170" y="295" text-anchor="middle" class="caption">Deformação pura com volume constante</text>
  </g>
</svg>