<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}
      .panel{font-size:22px;font-weight:700}
      .lab{font-size:18px}
      .eq{font-size:18px;font-family:"DejaVu Sans",Arial,sans-serif}
      .line{stroke:#374151;stroke-width:3;fill:none}
      .thin{stroke:#64748b;stroke-width:2;fill:none}
      .guide{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:7 6}
      .vec{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .rvec{stroke:#b42318;stroke-width:3;fill:none;marker-end:url(#redarrow)}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    </style>
  </defs>

<rect width="1100" height="560" fill="white"/>
<rect x="360" y="150" width="380" height="220" rx="10" fill="#eef5fb" stroke="#263238" stroke-width="3"/>
<text x="550" y="245" text-anchor="middle" class="panel">dV = A Δx</text>
<text x="550" y="290" text-anchor="middle" class="eq">dm = ρ A Δx</text>

<line x1="110" y1="260" x2="345" y2="260" class="vec"/>
<text x="210" y="220" text-anchor="middle" class="panel">P</text>
<text x="210" y="315" text-anchor="middle" class="eq">F_L = P A</text>

<line x1="990" y1="260" x2="755" y2="260" class="vec"/>
<text x="890" y="220" text-anchor="middle" class="panel">P + ΔP</text>
<text x="890" y="315" text-anchor="middle" class="eq">F_R = (P + ΔP)A</text>

<line x1="670" y1="95" x2="430" y2="95" class="rvec"/>
<text x="550" y="70" text-anchor="middle" class="eq">ΣFₓ = −ΔP A</text>
<text x="550" y="125" text-anchor="middle" class="eq">aₓ = −ΔP/(ρ Δx)</text>

<line x1="360" y1="430" x2="740" y2="430" class="thin"/>
<line x1="360" y1="410" x2="360" y2="450" class="thin"/>
<line x1="740" y1="410" x2="740" y2="450" class="thin"/>
<text x="550" y="480" text-anchor="middle" class="eq">Δx</text>
<line x1="300" y1="520" x2="820" y2="520" class="thin" marker-end="url(#arrow)"/>
<text x="835" y="526" class="lab">x</text>
</svg>