<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="440" viewBox="0 0 1150 440">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .formula { font-family: "DejaVu Sans", Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #0369a1; }
      .pt-lbl { font-family: "DejaVu Sans", Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0f172a; }
    </style>
    <marker id="arr-axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#0f172a"/>
    </marker>
    <marker id="arr-vel" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-drop" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1150" height="440" class="bg"/>

  <!-- Painel 1: Laplaciano Discreto -->
  <rect x="25" y="25" width="530" height="390" class="card"/>
  <text x="50" y="60" class="title">1. Discrepância da Vizinhança</text>
  <text x="50" y="82" class="formula">∇²φ ≈ (2/Δx²) [ (φ_i+1 + φ_i-1)/2 − φ_i ]</text>

  <!-- Curva côncava com pico central -->
  <path d="M 70 300 Q 290 140 510 300" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Ponto central i (pico) -->
  <circle cx="290" cy="180" r="6" fill="#dc2626"/>
  <text x="290" y="160" class="pt-lbl" fill="#dc2626" text-anchor="middle">φ_i (Pico)</text>

  <!-- Pontos vizinhos i-1 e i+1 -->
  <circle cx="150" cy="250" r="5" fill="#0f172a"/>
  <text x="135" y="275" class="pt-lbl">φ_i-1</text>

  <circle cx="430" cy="250" r="5" fill="#0f172a"/>
  <text x="420" y="275" class="pt-lbl">φ_i+1</text>

  <!-- Secante média entre vizinhos -->
  <line x1="150" y1="250" x2="430" y2="250" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="290" cy="250" r="5" fill="#64748b"/>
  <text x="300" y="268" font-family="system-ui" font-size="12" fill="#64748b">Média dos vizinhos</text>

  <!-- Vetor drop com texto BEM POSICIONADO à esquerda -->
  <line x1="290" y1="190" x2="290" y2="242" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-drop)"/>
  <text x="200" y="218" font-family="DejaVu Sans" font-size="13" font-weight="700" fill="#dc2626">∇²φ &lt; 0</text>

  <!-- Painel 2: Difusão Viscosa -->
  <rect x="585" y="25" width="540" height="390" class="card"/>
  <text x="610" y="60" class="title">2. Difusão Viscosa</text>
  <text x="610" y="82" class="formula">∂u/∂t = ν (∂²u/∂y²)</text>

  <!-- Eixos coordenados -->
  <line x1="630" y1="330" x2="1080" y2="330" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <text x="1090" y="334" class="pt-lbl">u</text>

  <line x1="650" y1="340" x2="650" y2="120" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <text x="645" y="110" class="pt-lbl">y</text>

  <!-- Perfil de velocidade t = 0 (degrau tracejado) -->
  <line x1="650" y1="200" x2="1020" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1020" y1="200" x2="1020" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1025" y="190" font-family="system-ui" font-size="11" fill="#64748b">t = 0 (degrau)</text>

  <!-- Perfil difundido t > 0 (curva suave) -->
  <path d="M 650 330 C 720 310, 850 250, 1010 150" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="960" y="240" font-family="system-ui" font-size="12" font-weight="700" fill="#dc2626">t &gt; 0 (difundido)</text>

  <!-- Setas horizontais de velocidade do perfil suave -->
  <line x1="650" y1="160" x2="1000" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-vel)"/>
  <line x1="650" y1="210" x2="900" y2="210" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-vel)"/>
  <line x1="650" y1="260" x2="770" y2="260" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-vel)"/>
  <line x1="650" y1="300" x2="690" y2="300" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-vel)"/>

  <!-- Hachuras da parede y=0 -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="650" y1="330" x2="640" y2="345"/>
    <line x1="680" y1="330" x2="670" y2="345"/>
    <line x1="710" y1="330" x2="700" y2="345"/>
    <line x1="740" y1="330" x2="730" y2="345"/>
  </g>
  <text x="640" y="365" font-family="system-ui" font-size="12" fill="#475569">Parede (u = 0)</text>
</svg>
