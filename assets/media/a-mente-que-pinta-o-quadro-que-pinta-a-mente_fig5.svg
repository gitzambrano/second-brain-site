<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Escala linear e escala logarítmica" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Escala linear e escala logarítmica</title><desc>Reta linear com 1, 10, 100 e 1000 amontoados à esquerda, reta logarítmica com os mesmos valores igualmente espaçados, e quatro exemplos cotidianos.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="418" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><text x="360.0" y="38.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Escala linear versus escala logarítmica</text><text x="60.0" y="80.0" font-size="15" font-weight="500" fill="#555555" text-anchor="start" >Escala linear: os valores pequenos se amontoam</text><line x1="70.0" y1="112.0" x2="650.0" y2="112.0" stroke="#a9a9a9" stroke-width="2" /><circle cx="70.6" cy="112" r="5" fill="#e08a1e"/><circle cx="75.8" cy="112" r="5" fill="#e08a1e"/><text x="73.8" y="140.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >1 e 10</text><circle cx="128.0" cy="112" r="5" fill="#e08a1e"/><text x="128.0" y="140.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >100</text><circle cx="650.0" cy="112" r="5" fill="#e08a1e"/><text x="650.0" y="140.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >1000</text><line x1="40.0" y1="170.0" x2="680.0" y2="170.0" stroke="#dcdcdc" stroke-width="2" /><text x="60.0" y="202.0" font-size="15" font-weight="500" fill="#555555" text-anchor="start" >Escala logarítmica: passos iguais para razões iguais (cada passo multiplica por 10)</text><line x1="70.0" y1="250.0" x2="650.0" y2="250.0" stroke="#a9a9a9" stroke-width="2" /><circle cx="70.0" cy="250" r="7" fill="#2b6cb0"/><text x="70.0" y="234.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >10⁰</text><text x="70.0" y="280.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >1</text><circle cx="263.3" cy="250" r="7" fill="#2b6cb0"/><text x="263.3" y="234.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >10¹</text><text x="263.3" y="280.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >10</text><circle cx="456.7" cy="250" r="7" fill="#2b6cb0"/><text x="456.7" y="234.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >10²</text><text x="456.7" y="280.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >100</text><circle cx="650.0" cy="250" r="7" fill="#2b6cb0"/><text x="650.0" y="234.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >10³</text><text x="650.0" y="280.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >1000</text><rect x="48" y="310" width="150" height="88" rx="14" fill="#f1f1f1"/><text x="123.0" y="336.0" font-size="16" font-weight="700" fill="#161616" text-anchor="middle" >Terremotos</text><text x="123.0" y="359.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >+1 de magnitude</text><text x="123.0" y="380.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >amplitude ×10</text><rect x="210" y="310" width="150" height="88" rx="14" fill="#f1f1f1"/><text x="285.0" y="336.0" font-size="16" font-weight="700" fill="#161616" text-anchor="middle" >Acidez</text><text x="285.0" y="359.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >−1 unidade de pH</text><text x="285.0" y="380.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >concentração ×10</text><rect x="372" y="310" width="150" height="88" rx="14" fill="#f1f1f1"/><text x="447.0" y="336.0" font-size="16" font-weight="700" fill="#161616" text-anchor="middle" >Som</text><text x="447.0" y="359.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >+10 dB</text><text x="447.0" y="380.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >potência ×10</text><rect x="534" y="310" width="150" height="88" rx="14" fill="#f1f1f1"/><text x="609.0" y="336.0" font-size="16" font-weight="700" fill="#161616" text-anchor="middle" >Música</text><text x="609.0" y="359.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >+1 oitava</text><text x="609.0" y="380.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >frequência ×2</text></svg>