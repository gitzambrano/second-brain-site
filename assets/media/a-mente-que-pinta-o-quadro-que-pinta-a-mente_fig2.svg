<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="O laço do cérebro que modela o mundo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>O laço do cérebro que modela o mundo</title><desc>Três etapas: o cérebro representa o mundo, o mundo representado contém o indivíduo, e o indivíduo representado possui um cérebro que representa o mundo; o ciclo volta ao início.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="442" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><rect x="95.0" y="30" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="78.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >O cérebro representa o mundo</text><path d="M330.0 118 V144" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="150" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="185.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >O mundo representado contém</text><text x="330.0" y="211.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >o próprio indivíduo</text><path d="M330.0 238 V264" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="270" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="305.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >O indivíduo representado possui</text><text x="330.0" y="331.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >um cérebro que representa o mundo</text><path d="M569.0 312.0 H617.0 V72.0 H575.0" fill="none" stroke="#e08a1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ao)"/><text x="345.0" y="414.0" font-size="18" font-weight="500" fill="#161616" text-anchor="middle" >↻ O modelo retorna ao próprio modelador</text></svg>