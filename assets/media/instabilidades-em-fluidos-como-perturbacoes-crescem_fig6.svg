<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b42318"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.panel{font-size:22px;font-weight:700}.lab{font-size:18px}.eq{font-size:18px;font-family:"DejaVu Sans",Arial,sans-serif}.line{stroke:#374151;stroke-width:3;fill:none}.thin{stroke:#64748b;stroke-width:2;fill:none}.guide{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:7 6}.vec{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#arrow)}.rvec{stroke:#b42318;stroke-width:3;fill:none;marker-end:url(#redarrow)}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}</style></defs><rect width="1400" height="720" fill="white"/><g><rect class="box" x="35" y="70" width="240" height="165" rx="10"/><text x="155" y="105" text-anchor="middle" class="panel">Cisalhamento</text><text x="155" y="140" text-anchor="middle" class="lab">Kelvin–Helmholtz</text><text x="155" y="168" text-anchor="middle" class="lab">Tollmien–Schlichting</text><text x="155" y="196" text-anchor="middle" class="lab">crossflow · wakes · jets</text><rect class="box" x="305" y="70" width="240" height="165" rx="10"/><text x="425" y="105" text-anchor="middle" class="panel">Empuxo / densidade</text><text x="425" y="140" text-anchor="middle" class="lab">Rayleigh–Taylor</text><text x="425" y="168" text-anchor="middle" class="lab">Rayleigh–Bénard</text><text x="425" y="196" text-anchor="middle" class="lab">Richtmyer–Meshkov</text><rect class="box" x="575" y="70" width="250" height="165" rx="10"/><text x="700" y="105" text-anchor="middle" class="panel">Rotação / curvatura</text><text x="700" y="140" text-anchor="middle" class="lab">Taylor–Couette · Görtler</text><text x="700" y="168" text-anchor="middle" class="lab">elíptica · inercial</text><text x="700" y="196" text-anchor="middle" class="lab">barotrópica · baroclínica</text><rect class="box" x="855" y="70" width="250" height="165" rx="10"/><text x="980" y="105" text-anchor="middle" class="panel">Interfaces</text><text x="980" y="140" text-anchor="middle" class="lab">Rayleigh–Plateau</text><text x="980" y="168" text-anchor="middle" class="lab">Saffman–Taylor · Marangoni</text><text x="980" y="196" text-anchor="middle" class="lab">Faraday · filmes finos</text><rect class="box" x="1135" y="70" width="230" height="165" rx="10"/><text x="1250" y="105" text-anchor="middle" class="panel">Compressíveis</text><text x="1250" y="140" text-anchor="middle" class="lab">Mack 1º / 2º modo</text><text x="1250" y="168" text-anchor="middle" class="lab">acústicas</text><text x="1250" y="196" text-anchor="middle" class="lab">choque / interface</text><rect class="box" x="170" y="330" width="300" height="165" rx="10"/><text x="320" y="365" text-anchor="middle" class="panel">Vórtices</text><text x="320" y="402" text-anchor="middle" class="lab">Crow · Widnall · elíptica</text><text x="320" y="430" text-anchor="middle" class="lab">pareamento · núcleo</text><text x="320" y="458" text-anchor="middle" class="lab">vortex breakdown</text><rect class="box" x="550" y="330" width="300" height="165" rx="10"/><text x="700" y="365" text-anchor="middle" class="panel">Campos adicionais</text><text x="700" y="402" text-anchor="middle" class="lab">MHD · magnetorrotacional</text><text x="700" y="430" text-anchor="middle" class="lab">eletro-hidrodinâmica</text><text x="700" y="458" text-anchor="middle" class="lab">ferrofluidos · plasmas</text><rect class="box" x="930" y="330" width="300" height="165" rx="10"/><text x="1080" y="365" text-anchor="middle" class="panel">Fluidos reativos</text><text x="1080" y="402" text-anchor="middle" class="lab">Darrieus–Landau</text><text x="1080" y="