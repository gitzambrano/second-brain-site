<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Escalas de ampliação e contagem de passos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Escalas de ampliação e contagem de passos</title><desc>Cinco quadrados cujo tamanho linear cai por um fator 4 a cada passo, e uma régua em que os mesmos cinco valores ficam igualmente espaçados.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="438" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><text x="360.0" y="38.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Cada cópia tem um quarto do tamanho linear da anterior</text><rect x="30.0" y="75.0" width="150" height="150" rx="6.0" fill="#6a8ab5" opacity="1"/><text x="105.0" y="253.0" font-size="17" font-weight="400" fill="#161616" text-anchor="middle" >1/1</text><rect x="236.2" y="187.5" width="37.5" height="37.5" rx="6.0" fill="#6a8ab5" opacity="0.78"/><text x="255.0" y="253.0" font-size="17" font-weight="400" fill="#161616" text-anchor="middle" >1/4</text><rect x="370.3" y="215.6" width="9.4" height="9.4" rx="2.4" fill="#6a8ab5" opacity="0.78"/><text x="375.0" y="253.0" font-size="17" font-weight="400" fill="#161616" text-anchor="middle" >1/16</text><rect x="483.9" y="222.7" width="2.3" height="2.3" rx="0.6" fill="#6a8ab5" opacity="0.78"/><text x="485.0" y="253.0" font-size="17" font-weight="400" fill="#161616" text-anchor="middle" >1/64</text><circle cx="590" cy="223" r="2" fill="#6a8ab5"/><text x="590.0" y="253.0" font-size="17" font-weight="400" fill="#161616" text-anchor="middle" >1/256</text><text x="360.0" y="277.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >em tamanho real, a cópia 1/256 mal se enxerga</text><line x1="40.0" y1="292.0" x2="680.0" y2="292.0" stroke="#dcdcdc" stroke-width="2" /><text x="360.0" y="322.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >Contando passos em vez de medir tamanhos (escala logarítmica)</text><line x1="70.0" y1="366.0" x2="630.0" y2="366.0" stroke="#a9a9a9" stroke-width="2" /><circle cx="105" cy="366" r="7" fill="#e08a1e"/><text x="105.0" y="348.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >1/1</text><text x="105.0" y="394.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >n = 0</text><circle cx="226" cy="366" r="7" fill="#e08a1e"/><text x="226.0" y="348.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >1/4</text><text x="226.0" y="394.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >n = 1</text><circle cx="347" cy="366" r="7" fill="#e08a1e"/><text x="347.0" y="348.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >1/16</text><text x="347.0" y="394.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >n = 2</text><circle cx="468" cy="366" r="7" fill="#e08a1e"/><text x="468.0" y="348.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >1/64</text><text x="468.0" y="394.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >n = 3</text><circle cx="589" cy="366" r="7" fill="#e08a1e"/><text x="589.0" y="348.0" font-size="15" font-weight="400" fill="#555555" text-anchor="middle" >1/256</text><text x="589.0" y="394.0" font-size="16" font-weight="600" fill="#161616" text-anchor="middle" >n = 4</text><text x="360.0" y="422.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >cada passo divide o tamanho por 4; na régua, cada passo soma 1</text></svg>