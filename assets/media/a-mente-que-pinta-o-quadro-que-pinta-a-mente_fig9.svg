<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Uma volta completa corresponde a ampliar 256 vezes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Uma volta completa corresponde a ampliar 256 vezes</title><desc>No plano logarítmico da gravura, uma volta completa é um segmento vertical de comprimento 2π; no plano da imagem Droste vira um segmento inclinado que avança ln 256 em u e 2π em v, terminando num ponto equivalente.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="448" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><text x="170.0" y="52.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Gravura (U, V)</text><text x="526.0" y="52.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Imagem Droste (u, v)</text><rect x="70" y="100" width="200" height="240" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><line x1="170.0" y1="340.0" x2="170.0" y2="106.0" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ab)"/><circle cx="170" cy="340" r="6" fill="#e08a1e"/><text x="62.0" y="345.0" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >0</text><text x="62.0" y="105.0" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >2π</text><text x="182.0" y="220.0" font-size="15" font-weight="600" fill="#2b6cb0" text-anchor="start" >ΔV = 2π</text><text x="182.0" y="242.0" font-size="15" font-weight="400" fill="#555555" text-anchor="start" >ΔU = 0</text><line x1="285.0" y1="220.0" x2="405.0" y2="220.0" stroke="#666" stroke-width="2.5" marker-end="url(#ah)"/><text x="345.0" y="192.0" font-size="15" font-weight="600" fill="#161616" text-anchor="middle" >u = U + kV</text><text x="345.0" y="254.0" font-size="15" font-weight="600" fill="#161616" text-anchor="middle" >v = V − kU</text><rect x="420" y="100" width="211.8" height="240" fill="none" stroke="#dcdcdc" stroke-width="1.5"/><line x1="420.0" y1="340.0" x2="625.8" y2="107.0" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ab)"/><circle cx="420" cy="340" r="6" fill="#e08a1e"/><circle cx="631.8" cy="100" r="6" fill="#e08a1e"/><text x="412.0" y="345.0" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >0</text><text x="412.0" y="105.0" font-size="14" font-weight="400" fill="#555555" text-anchor="end" >2π</text><text x="525.9" y="364.0" font-size="14" font-weight="600" fill="#2b6cb0" text-anchor="middle" >ln 256</text><text x="170.0" y="404.0" font-size="15" font-weight="400" fill="#161616" text-anchor="middle" >uma volta completa</text><text x="170.0" y="426.0" font-size="15" font-weight="400" fill="#161616" text-anchor="middle" >em torno do centro</text><text x="526.0" y="404.0" font-size="15" font-weight="400" fill="#161616" text-anchor="middle" >ampliação ×256 e giro de 2π:</text><text x="526.0" y="426.0" font-size="15" font-weight="400" fill="#161616" text-anchor="middle" >ponto de chegada equivalente</text></svg>