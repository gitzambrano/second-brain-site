<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 594" width="720" height="594" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Os níveis do laço de Print Gallery" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Os níveis do laço de Print Gallery</title><desc>Quatro níveis: a cena, o artista, o leitor e a teoria, cada um descrevendo o anterior, com retorno ao início.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="592" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><rect x="95.0" y="30" width="470" height="96" rx="16" fill="#f1f1f1"/><text x="330.0" y="58.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Nível 1: a cena</text><text x="330.0" y="84.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >O visitante desenhado contempla</text><text x="330.0" y="110.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >a imagem que o contém</text><path d="M330.0 130 V150" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="156" width="470" height="96" rx="16" fill="#f1f1f1"/><text x="330.0" y="184.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Nível 2: o artista</text><text x="330.0" y="210.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >A consciência de Escher cria a cena</text><text x="330.0" y="236.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >e o observador que ela contém</text><path d="M330.0 256 V276" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="282" width="470" height="96" rx="16" fill="#f1f1f1"/><text x="330.0" y="310.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Nível 3: o leitor</text><text x="330.0" y="336.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >Percebe a imagem, o autor ausente</text><text x="330.0" y="362.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >e o próprio ato de reconhecer o laço</text><path d="M330.0 382 V402" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="408" width="470" height="96" rx="16" fill="#f1f1f1"/><text x="330.0" y="436.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Nível 4: a teoria</text><text x="330.0" y="462.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >A matemática de Leiden e a filosofia</text><text x="330.0" y="488.0" font-size="16" font-weight="400" fill="#555555" text-anchor="middle" >de Hofstadter modelam a obra e a mente</text><path d="M569.0 456.0 H617.0 V78.0 H575.0" fill="none" stroke="#e08a1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ao)"/><text x="345.0" y="564.0" font-size="18" font-weight="500" fill="#161616" text-anchor="middle" >↻ cada nível descreve o anterior e o conjunto retorna a si</text></svg>