<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" width="720" height="564" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="O laço de Gödel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>O laço de Gödel</title><desc>Fórmulas e provas viram números, a aritmética passa a falar de fórmulas, e uma fórmula pode falar de si mesma.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="562" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><rect x="95.0" y="30" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="65.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Fórmulas e provas viram números</text><text x="330.0" y="91.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >(numeração de Gödel)</text><path d="M330.0 118 V144" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="150" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="198.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >A aritmética fala sobre números</text><path d="M330.0 238 V264" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="270" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="305.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Logo, também fala sobre fórmulas</text><text x="330.0" y="331.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >e provas, que agora são números</text><path d="M330.0 358 V384" stroke="#777" stroke-width="2.5" fill="none" marker-end="url(#ah)"/><rect x="95.0" y="390" width="470" height="84" rx="16" fill="#f1f1f1"/><text x="330.0" y="425.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >Uma fórmula pode falar de si mesma:</text><text x="330.0" y="451.0" font-size="19" font-weight="700" fill="#161616" text-anchor="middle" >G diz «G não é demonstrável»</text><path d="M569.0 432.0 H617.0 V72.0 H575.0" fill="none" stroke="#e08a1e" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ao)"/><text x="345.0" y="534.0" font-size="18" font-weight="500" fill="#161616" text-anchor="middle" >↻ O sistema passa a representar a si mesmo</text></svg>