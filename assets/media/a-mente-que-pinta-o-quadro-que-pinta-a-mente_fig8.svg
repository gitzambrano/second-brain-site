<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" width="720" height="435" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Retângulo de periodicidade e toro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Retângulo de periodicidade e toro</title><desc>Um retângulo de lados ln 256 e 2π repetido em ladrilhos, com as bordas opostas identificadas, forma um toro.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#666"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a1e"/></marker></defs><rect x="1" y="1" width="718" height="433" rx="22" fill="#fcfcfc" stroke="#e2e2e2" stroke-width="2"/><text x="180.0" y="52.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Retângulo de periodicidade</text><text x="548.0" y="52.0" font-size="18" font-weight="600" fill="#161616" text-anchor="middle" >Toro complexo</text><rect x="60" y="80" width="120" height="136" fill="#f4f4f4" stroke="#a9a9a9" stroke-width="1.2"/><polygon points="84.0,182.0 84.0,134.4 120.0,104.5 156.0,134.4 156.0,182.0" fill="#6a8ab5" opacity="0.85"/><rect x="60" y="216" width="120" height="136" fill="#dbe6f5" stroke="#a9a9a9" stroke-width="1.2"/><polygon points="84.0,318.0 84.0,270.4 120.0,240.5 156.0,270.4 156.0,318.0" fill="#6a8ab5" opacity="0.85"/><rect x="180" y="80" width="120" height="136" fill="#f4f4f4" stroke="#a9a9a9" stroke-width="1.2"/><polygon points="204.0,182.0 204.0,134.4 240.0,104.5 276.0,134.4 276.0,182.0" fill="#6a8ab5" opacity="0.85"/><rect x="180" y="216" width="120" height="136" fill="#f4f4f4" stroke="#a9a9a9" stroke-width="1.2"/><polygon points="204.0,318.0 204.0,270.4 240.0,240.5 276.0,270.4 276.0,318.0" fill="#6a8ab5" opacity="0.85"/><line x1="60.0" y1="216.0" x2="60.0" y2="352.0" stroke="#2b6cb0" stroke-width="4.5" /><line x1="180.0" y1="216.0" x2="180.0" y2="352.0" stroke="#2b6cb0" stroke-width="4.5" /><line x1="60.0" y1="216.0" x2="180.0" y2="216.0" stroke="#e08a1e" stroke-width="4.5" /><line x1="60.0" y1="352.0" x2="180.0" y2="352.0" stroke="#e08a1e" stroke-width="4.5" /><text x="120.0" y="378.0" font-size="14" font-weight="600" fill="#2b6cb0" text-anchor="middle" >ln 256 ≈ 5,55</text><text x="48.0" y="284.0" font-size="14" font-weight="600" fill="#e08a1e" text-anchor="middle" transform="rotate(-90 48 284.0)">2π ≈ 6,28</text><line x1="318.0" y1="215.0" x2="405.0" y2="215.0" stroke="#666" stroke-width="2.5" marker-end="url(#ah)"/><text x="361.0" y="198.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >colar as</text><text x="361.0" y="238.0" font-size="14" font-weight="400" fill="#555555" text-anchor="middle" >bordas</text><ellipse cx="548" cy="218" rx="100" ry="55" fill="none" stroke="#d3deee" stroke-width="48"/><ellipse cx="548" cy="218" rx="124" ry="79" fill="none" stroke="#a9a9a9" stroke-width="1.5"/><ellipse cx="548" cy="218" rx="76" ry="31" fill="#fcfcfc" stroke="#a9a9a9" stroke-width="1.5"/><ellipse cx="548" cy="218" rx="100" ry="55" fill="none" stroke="#e08a1e" stroke-width="3" stroke-dasharray="7 5"/><ellipse cx="448" cy="218" rx="12" ry="24" fill="none" stroke="#2b6cb0" stroke-width="3.5"/><text x="360.0" y="418.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle" >deslizar ln 256 na horizontal ou 2π na vertical leva a pontos equivalentes</text><text x="548.0" y="340.0" font-size="13" font-weight="400" fill="#e08a1e" text-anchor="middle" >laranja: volta em torno do centro</text><text x="548.0" y="360.0" font-size="13" font-weight="400" fill="#2b6cb0" text-anchor="middle" >azul: ampliação por 256</text></svg>