name: Newsletter

on:
  workflow_run:
    workflows: ["Deploy Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  send:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detectar manifesto
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=.github/newsletter-manifest.json
          if [ ! -f "$CURRENT" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "newsletter: manifesto ausente; nada a enviar"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

          # Primeiro deploy da feature = baseline, nunca rajada histórica.
          if git show HEAD^:.github/newsletter-manifest.json > /tmp/newsletter-previous.json 2>/dev/null; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            cp "$CURRENT" /tmp/newsletter-previous.json
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "newsletter: baseline criado; nenhum envio no primeiro deploy"
          fi

      - name: Preparar modo
        if: steps.manifest.outputs.present == 'true'
        id: mode
        shell: bash
        env:
          ENABLED: ${{ vars.KIT_NEWSLETTER_ENABLED }}
        run: |
          if [ "${ENABLED:-}" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar newsletter
        if: steps.manifest.outputs.present == 'true'
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
        run: >-
          python .github/scripts/send_kit_newsletter.py
          .github/newsletter-manifest.json
          --previous-manifest /tmp/newsletter-previous.json
          ${{ steps.mode.outputs.args }}
