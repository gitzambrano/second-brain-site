name: Newsletter

on:
  workflow_run:
    workflows: ["Publish site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      previous_ref:
        description: "Git ref para comparar o manifesto (ex: 5e0677f ou HEAD^). Deixe vazio para usar HEAD^."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  send:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detectar manifesto
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=.github/newsletter-manifest.json
          if [ ! -f "$CURRENT" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "newsletter: manifesto ausente; nada a enviar"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

          PREVIOUS_REF="${{ github.event.inputs.previous_ref }}"
          if [ -z "$PREVIOUS_REF" ]; then
            PREVIOUS_REF="HEAD^"
          fi

          # Compara contra o manifesto da revisão anterior.
          # Se não houver a ref anterior com o manifesto, usa o próprio como baseline (evita rajada histórica).
          if git show "$PREVIOUS_REF":.github/newsletter-manifest.json > /tmp/newsletter-previous.json 2>/dev/null; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            cp "$CURRENT" /tmp/newsletter-previous.json
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "newsletter: baseline criado; nenhum envio no primeiro deploy"
          fi

      - name: Preparar modo
        if: steps.manifest.outputs.present == 'true'
        id: mode
        shell: bash
        env:
          ENABLED: ${{ vars.KIT_NEWSLETTER_ENABLED }}
        run: |
          if [ "${ENABLED:-}" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar newsletter
        if: steps.manifest.outputs.present == 'true'
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
        run: >-
          python .github/scripts/send_kit_newsletter.py
          .github/newsletter-manifest.json
          --previous-manifest /tmp/newsletter-previous.json
          ${{ steps.mode.outputs.args }}
