name: Publish sealed site once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sealed-temp-once.yml'

permissions:
  contents: write

concurrency:
  group: publish-sealed-site-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve, download and verify sealed projection
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://temp.sh/fHNox/sealed-site.zip'
          EXPECTED='1f8798483b23b0afffd013d63bd47b4a2ed176b9d130ca55235d92159ea8fa1f'
          curl --fail --silent --show-error --location --retry 3 --max-time 60 "$BASE" -o /tmp/landing.html
          echo '--- temp.sh landing page ---'
          cat /tmp/landing.html
          echo '--- extracted attributes / URLs ---'
          BASE="$BASE" python - <<'PY' > /tmp/candidates.txt
          import os, re
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base=os.environ['BASE']
          text=open('/tmp/landing.html',encoding='utf-8',errors='ignore').read()
          vals=[]
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for k,v in d.items():
                      if v and (k in {'href','src','action','value','data-url','data-href','data-download','download'} or 'url' in k or 'download' in k):
                          vals.append((tag,k,v))
          P().feed(text)
          for tag,k,v in vals:
              print(f'# {tag} {k}={v}')
          found=[]
          for _,_,v in vals:
              if v.startswith(('http://','https://','/','./','../')):
                  found.append(urljoin(base,v))
          for u in re.findall(r'https?://[^\"\'<>\\s]+', text):
              found.append(u)
          for m in re.finditer(r'(?i)(?:download|file)[^\n]{0,180}', text):
              print('# context:', m.group(0))
          for u in [base, base+'?download=1', base+'?dl=1',
                    'https://temp.sh/download/fHNox/sealed-site.zip',
                    'https://temp.sh/d/fHNox/sealed-site.zip']:
              found.append(u)
          seen=set()
          for u in found:
              u=u.rstrip(').,;')
              if u not in seen:
                  seen.add(u); print(u)
          PY
          cat /tmp/candidates.txt
          FOUND=0
          while IFS= read -r URL; do
            [[ "$URL" == http* ]] || continue
            rm -f /tmp/candidate.zip
            if curl --fail --silent --show-error --location --retry 1 --max-time 90 "$URL" -o /tmp/candidate.zip; then
              GOT="$(sha256sum /tmp/candidate.zip | awk '{print $1}')"
              echo "candidate $GOT $URL"
              if [ "$GOT" = "$EXPECTED" ]; then
                mv /tmp/candidate.zip /tmp/sealed-site.zip
                echo "Verified direct download: $URL"
                FOUND=1
                break
              fi
            fi
          done < /tmp/candidates.txt
          test "$FOUND" = 1
          echo "$EXPECTED  /tmp/sealed-site.zip" | sha256sum -c -
          mkdir -p /tmp/site
          unzip -q /tmp/sealed-site.zip -d /tmp/site
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/site/site-manifest.json').read_text(encoding='utf-8'))
          seal=m.get('seal') or {}
          assert m.get('generated')=='2026-09-12'
          assert m.get('count')==44
          assert set(seal.get('gates') or [])=={'privacy','budget','pages'}
          assert seal.get('artifact_digest')=='c1185f3de6cb29300ecbd03a63d6a560b117e157fc95df36a2502c5668a2b80c'
          print('canonical seal validated:',seal['artifact_digest'])
          PY

      - name: Apply exact generated delta
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/site/assets/cover-dark.png assets/cover-dark.png
          install -m 0644 /tmp/site/assets/cover-light.png assets/cover-light.png
          install -m 0644 /tmp/site/graph.html graph.html
          install -m 0644 /tmp/site/index.html index.html
          install -m 0644 /tmp/site/search-index.json search-index.json
          install -m 0644 /tmp/site/site-manifest.json site-manifest.json
          install -m 0644 /tmp/site/sphere.html sphere.html
          git diff --check
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          assets/cover-dark.png
          assets/cover-light.png
          graph.html
          index.html
          search-index.json
          site-manifest.json
          sphere.html
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit publication and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/force-publish-sealed-commit.yml
          rm -f .github/workflows/force-publish-sealed-final.yml
          rm -f .github/workflows/force-publish-sealed-once.yml
          rm -f .github/workflows/force-publish-sealed-retry.yml
          rm -f .github/workflows/publish-sealed-temp-once.yml
          git config user.name 'Second Brain Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publicação do site: 2026-09-12'
          git push origin HEAD:main
