name: Screenshot-validated mobile header publish once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-header-screenshot-publish-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply public projection fix
        run: python .github/scripts/mobile_header_publish_fix_once.py
      - name: Install browser audit
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture and compare mobile screenshots
        run: python .github/scripts/mobile_header_visual_audit.py
      - name: Upload visual audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-header-visual-audit
          path: visual-audit/
          retention-days: 3
      - name: Commit validated public projection and clean helpers
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/mobile-header-screenshot-publish-once.yml .github/scripts/mobile_header_publish_fix_once.py .github/scripts/mobile_header_visual_audit.py
          git add index.html graph.html essays
          git diff --cached --check
          git commit -m "Align mobile header pixel geometry and reveal graph labels earlier"
          git push origin HEAD:main
