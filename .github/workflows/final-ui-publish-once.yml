name: Final validated UI publication once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-ui-publish-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize projection helper for current public format
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/scripts/publish_final_ui_once.py')
          text = p.read_text(encoding='utf-8')

          # Public graph/sphere payloads are base64 + raw DEFLATE and use
          # id="sb-graph-data". Normalize the one-shot helper to that actual format.
          if 'import gzip\n' not in text:
              raise SystemExit('stale gzip helper import not found')
          text = text.replace('import gzip\n', 'import zlib\n', 1)

          old_png = 'graph = replace_between(graph, "const EXPORT_SCALE = 3;", "// ---- Exportar SVG", png_block, "graph PNG export")'
          new_png = 'graph = replace_between(graph, "// ---- Exportar PNG", "// ---- Exportar SVG", png_block, "graph PNG export")'
          if text.count(old_png) != 1:
              raise SystemExit(f'expected one old PNG projection boundary, got {text.count(old_png)}')
          text = text.replace(old_png, new_png, 1)

          start = text.find('def patch_compressed_default_style')
          end = text.find('\n\n# Landing CTA only.', start)
          if start < 0 or end < 0:
              raise SystemExit('compressed-style helper boundaries not found')
          replacement = r'''def patch_compressed_default_style(text: str, label: str) -> str:
              pattern = re.compile(
                  r''' + "'''" + r'''(<script\b(?=[^>]*\bid=["']sb-graph-data["'])[^>]*>)(?P<body>.*?)(</script>)''' + "'''" + r''',
                  re.S | re.I,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"{label}: compressed sb-graph-data payload not found")
              try:
                  compressed = base64.b64decode(match.group("body").strip())
                  raw = zlib.decompress(compressed, wbits=-zlib.MAX_WBITS).decode("utf-8")
                  payload = json.loads(raw)
              except Exception as exc:
                  raise SystemExit(f"{label}: cannot decode sb-graph-data: {exc}") from exc
              if not isinstance(payload, dict):
                  raise SystemExit(f"{label}: graph-data must be an object")
              style = payload.get("defaultStyle")
              if not isinstance(style, dict):
                  raise SystemExit(f"{label}: defaultStyle missing; keys={sorted(payload.keys())}")
              colors = style.setdefault("colors", {})
              if not isinstance(colors, dict):
                  raise SystemExit(f"{label}: defaultStyle.colors must be an object")
              colors["edge"] = "#858b93"
              style["edgeOpacity"] = 0.28

              encoded_raw = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              compressor = zlib.compressobj(level=9, wbits=-zlib.MAX_WBITS)
              encoded_bytes = compressor.compress(encoded_raw) + compressor.flush()
              encoded = base64.b64encode(encoded_bytes).decode("ascii")
              text = text[:match.start("body")] + encoded + text[match.end("body"):]

              verify = pattern.search(text)
              if not verify:
                  raise SystemExit(f"{label}: compressed payload disappeared after rewrite")
              decoded_raw = zlib.decompress(
                  base64.b64decode(verify.group("body").strip()),
                  wbits=-zlib.MAX_WBITS,
              ).decode("utf-8")
              decoded = json.loads(decoded_raw)
              vstyle = decoded["defaultStyle"]
              if vstyle.get("edgeOpacity") != 0.28 or vstyle.get("colors", {}).get("edge") != "#858b93":
                  raise SystemExit(f"{label}: compressed style verification failed")
              return text'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply final engine UI projection
        run: python .github/scripts/publish_final_ui_once.py

      - name: Validate generated source contracts
        run: |
          python - <<'PY'
          import base64, json, re, subprocess, zlib
          from pathlib import Path

          payload_pattern = re.compile(
              r'''(<script\b(?=[^>]*\bid=["']sb-graph-data["'])[^>]*>)(?P<body>.*?)(</script>)''',
              re.S | re.I,
          )
          for filename in ('graph.html', 'sphere.html'):
              text = Path(filename).read_text(encoding='utf-8')
              m = payload_pattern.search(text)
              if not m:
                  raise SystemExit(f'{filename}: compressed sb-graph-data payload missing')
              compressed = base64.b64decode(m.group('body').strip())
              payload = json.loads(zlib.decompress(compressed, wbits=-zlib.MAX_WBITS).decode('utf-8'))
              style = payload['defaultStyle']
              assert style['colors']['edge'] == '#858b93', (filename, style['colors'].get('edge'))
              assert style['edgeOpacity'] == 0.28, (filename, style.get('edgeOpacity'))
              if filename == 'sphere.html':
                  assert style.get('edgeVisibility') == 'sempre', style.get('edgeVisibility')

              out = Path('visual-audit-final') / f'js-{filename[:-5]}'
              out.mkdir(parents=True, exist_ok=True)
              scripts = []
              for idx, sm in enumerate(re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', text, re.S | re.I)):
                  attrs = sm.group('attrs')
                  if re.search(r'''\bid=["']sb-(?:graph|reader)-data["']''', attrs, re.I):
                      continue
                  if re.search(r'''type=["']application/(?:json|ld\+json)["']''', attrs, re.I):
                      continue
                  body = sm.group('body')
                  if not body.strip():
                      continue
                  p = out / f'inline-{idx}.js'
                  p.write_text(body, encoding='utf-8')
                  scripts.append(p)
              if not scripts:
                  raise SystemExit(f'{filename}: no JavaScript extracted')
              for p in scripts:
                  subprocess.run(['node', '--check', str(p)], check=True)
              print(filename, 'node --check PASS', len(scripts))

          graph = Path('graph.html').read_text(encoding='utf-8')
          assert 'const LABEL_SHOW_AT = DEVICE_IS_MOBILE ? 0.62 : 0.78;' in graph
          assert 'const LABEL_HIDE_AT = DEVICE_IS_MOBILE ? 0.56 : 0.72;' in graph
          for token in ('EXPORT_SCALE', 'export-svg-popover', 'btn-export-svg-completo', 'btn-export-svg-simples', 'ensureC2S'):
              assert token not in graph, token
          assert 'canvas.toBlob' in graph
          assert 'function buildSvgExport()' in graph

          index = Path('index.html').read_text(encoding='utf-8')
          assert 'background:var(--accent-soft);' in index
          assert '<section class="library shell" id="library">' in index
          for token in ('searchbox', 'data-layout', 'data-density'):
              assert token in index, token

          essays = list(Path('essays').glob('*.html'))
          assert essays
          for p in essays:
              t = p.read_text(encoding='utf-8')
              assert 'background:var(--sb-primary-soft);' in t, p.name
              assert t.count('id="sbProgressFill"') == 1, p.name
          print('public source contracts PASS; essays=', len(essays))
          PY
          git diff --check

      - name: Install Chromium audit dependencies
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Run final browser audit
        run: python .github/scripts/audit_final_ui_publish_once.py

      - name: Upload final visual audit
        uses: actions/upload-artifact@v4
        with:
          name: final-ui-publication-audit
          path: visual-audit-final/
          retention-days: 3

      - name: Commit public site and self-clean
        run: |
          set -euo pipefail
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf visual-audit-final
          git rm -f .github/workflows/final-ui-publish-once.yml
          git rm -f .github/scripts/publish_final_ui_once.py .github/scripts/audit_final_ui_publish_once.py
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/final-ui-publish-once.yml
          test ! -e .github/scripts/publish_final_ui_once.py
          test ! -e .github/scripts/audit_final_ui_publish_once.py
          git commit -m "Publicação do site: 2026-09-10 — final UI fixes"
          git push origin HEAD:main
