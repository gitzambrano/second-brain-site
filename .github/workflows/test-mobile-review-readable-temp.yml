name: Test readable mobile review spacing

on:
  push:
    branches: [test/mobile-review-spacing-readable]
    paths:
      - '.github/workflows/test-mobile-review-readable-temp.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright client
        run: python -m pip install playwright
      - name: Prepare candidate copies
        run: |
          set -euo pipefail
          mkdir -p /tmp/base /tmp/a /tmp/b /tmp/c screenshots
          for d in base a b c; do rsync -a --exclude='.git/' --exclude='.github/' ./ /tmp/$d/; done
          python - <<'PY'
          from pathlib import Path
          old_head='  .card-head { gap: 6px; }\n'
          old_meta='  .card-meta { font-size: 10.5px; gap: 6px; }\n'
          old_read='  .card-meta .dot + span { font-size: 9.25px; letter-spacing: -0.045em; }\n'
          old_badge='  .badge { font-size: 9px; padding: 2px 6px; letter-spacing: 0.04em; }\n'
          variants={
            'a':('  .card-head { gap: 2px; }\n','  .card-meta { font-size: 10.5px; gap: 5px; }\n','  .card-meta .dot + span { font-size: 10px; letter-spacing: -0.035em; }\n','  .badge { font-size: 9px; padding: 2px 4px; letter-spacing: 0.04em; }\n'),
            'b':('  .card-head { gap: 2px; }\n','  .card-meta { font-size: 10.5px; gap: 5px; }\n','  .card-meta .dot + span { font-size: 10px; letter-spacing: -0.045em; }\n','  .badge { font-size: 9px; padding: 2px 4px; letter-spacing: 0.04em; }\n'),
            'c':('  .card-head { gap: 2px; }\n','  .card-meta { font-size: 10.5px; gap: 4px; }\n','  .card-meta .dot + span { font-size: 10.25px; letter-spacing: -0.045em; }\n','  .badge { font-size: 9px; padding: 2px 4px; letter-spacing: 0.04em; }\n'),
          }
          for name, vals in variants.items():
            p=Path('/tmp')/name/'assets/site.css'; s=p.read_text(encoding='utf-8')
            for old,new in zip((old_head,old_meta,old_read,old_badge),vals):
              if old not in s: raise SystemExit(f'missing rule in {name}: {old}')
              s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Serve variants
        run: |
          python -m http.server 8200 --directory /tmp/base >/tmp/base.log 2>&1 &
          python -m http.server 8201 --directory /tmp/a >/tmp/a.log 2>&1 &
          python -m http.server 8202 --directory /tmp/b >/tmp/b.log 2>&1 &
          python -m http.server 8203 --directory /tmp/c >/tmp/c.log 2>&1 &
          sleep 2
      - name: Measure real cards and screenshot
        run: |
          cat > /tmp/check.py <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright
          PORTS={'base':8200,'a':8201,'b':8202,'c':8203}
          async def inspect(browser,name,width,take=False):
            context=await browser.new_context(viewport={'width':width,'height':900},device_scale_factor=1)
            page=await context.new_page()
            await page.add_init_script("localStorage.setItem('sb-view-v2', JSON.stringify({layout:'list',density:'compact'}))")
            await page.goto(f'http://127.0.0.1:{PORTS[name]}/index.html',wait_until='networkidle'); await page.evaluate('document.fonts.ready')
            rows=await page.eval_on_selector_all('.essay-card[data-status="revisao"]', '''cards => cards.map((card,i)=>{const badge=card.querySelector('.badge-review');const expand=card.querySelector('.card-expand');const reading=card.querySelector('.card-meta .dot + span');if(!badge||!expand||!reading)return null;const b=badge.getBoundingClientRect(),e=expand.getBoundingClientRect(),r=reading.getBoundingClientRect();return {index:i,title:card.dataset.title,gap:e.left-b.right,readingWidth:r.width};}).filter(Boolean)''')
            worst=min(rows,key=lambda x:x['gap'])
            if take:
              card=page.locator('.essay-card[data-status="revisao"]').nth(worst['index']); await card.scroll_into_view_if_needed(); await page.wait_for_timeout(150); await card.screenshot(path=f'screenshots/{name}-{width}.png')
            await context.close(); return worst
          async def main():
            out={}
            async with async_playwright() as p:
              browser=await p.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
              for name in PORTS:
                for width in (360,390): out[f'{name}-{width}']=await inspect(browser,name,width)
              passing=[n for n in ('c','a','b') if out[f'{n}-360']['gap']>=3 and out[f'{n}-390']['gap']>=3]
              out['chosen']=passing[0] if passing else max(('a','b','c'),key=lambda n:out[f'{n}-360']['gap'])
              print(json.dumps(out,indent=2,ensure_ascii=False))
              for width in (360,390):
                await inspect(browser,'base',width,True); await inspect(browser,out['chosen'],width,True)
              await browser.close()
            Path('screenshots/metrics.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8'); Path('screenshots/chosen.txt').write_text(out['chosen'],encoding='utf-8')
            if out[f"{out['chosen']}-360"]['gap'] < 0: raise SystemExit('best candidate still overlaps at 360px')
          asyncio.run(main())
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-review-readable-screenshots
          path: screenshots/
