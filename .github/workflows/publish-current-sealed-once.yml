name: Publish current sealed projection once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-current-sealed-once.yml'

permissions:
  contents: write

concurrency:
  group: publish-current-sealed-projection-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download sealed public artifact
        shell: bash
        run: |
          set -euo pipefail
          URL='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f638-820e-82c4-c91f2bde1ac3/raw?se=2026-09-12T13%3A42%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=fb651447-b059-5e3e-b26d-3a7125336fe3&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T11%3A57%3A25Z&ske=2026-09-13T11%3A57%3A25Z&sks=b&skv=2026-02-06&sig=j/e7glMfkkVAPuz%2BSJRmP28VXJZFM4Q8DVdGMjw26lo%3D'
          curl --fail --location --retry 3 --max-time 180 "$URL" -o /tmp/public-site.zip
          echo 'd4919ed21bb542bc82c121a205811e38074ea9ec0f65e10f1674c99ff1df2c1f  /tmp/public-site.zip' | sha256sum -c -
          mkdir -p /tmp/site
          unzip -q /tmp/public-site.zip -d /tmp/site
          test -s /tmp/site/site-manifest.json
          test -s /tmp/site/graph.html
          test -s /tmp/site/sphere.html

      - name: Verify seal and new graph nodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, re, zlib
          from pathlib import Path

          root = Path('/tmp/site')
          manifest = json.loads((root / 'site-manifest.json').read_text(encoding='utf-8'))
          seal = manifest.get('seal') or {}
          assert set(seal.get('gates') or []) >= {'privacy', 'budget', 'pages'}
          assert seal.get('artifact_digest') == 'aff84d2d0f8b2c8ea683e6bf2d90f56f4dd1afeb028f8f43d787c20753c8e5b0'
          assert (seal.get('engine') or {}).get('sha') == 'a6368459f9fb2b11d75bbbdfe9944fb23fd38e4b'
          assert (seal.get('engine') or {}).get('dirty') is False

          text = (root / 'graph.html').read_text(encoding='utf-8')
          match = re.search(r'id="sb-graph-data">(.*?)</script>', text, re.S)
          assert match
          graph = json.loads(zlib.decompress(base64.b64decode(match.group(1).strip()), -15))
          ids = {node['id'] for node in graph['nodes']}
          required = {
              'concept:vorticidade',
              'concept:circulacao',
              'concept:instabilidade-kelvin-helmholtz',
              'entity:hermann-von-helmholtz',
              'entity:william-thomson-lord-kelvin',
              'entity:ludwig-prandtl',
              'concept:linha-sustentadora-de-prandtl',
          }
          assert required <= ids, sorted(required - ids)
          print('seal and graph nodes verified')
          PY

      - name: Promote exact public projection
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./

      - name: Verify promoted artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'site-manifest.json').read_text(encoding='utf-8'))
          expected = manifest['seal']['artifact_digest']
          text_suffixes = {'.html', '.json', '.js', '.css', '.txt', '.md', '.xml', '.svg'}
          excluded_root = {'README.md', '.gitignore', '.second-brain-site', 'site-manifest.json'}
          h = hashlib.sha256()
          files = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if '.git' in rel.parts or '.github' in rel.parts:
                  continue
              if path.parent == root and path.name in excluded_root:
                  continue
              files.append(path)
          for path in sorted(files, key=lambda p: p.relative_to(root).as_posix()):
              data = path.read_bytes()
              if path.suffix.lower() in text_suffixes:
                  data = data.replace(b'\r\n', b'\n')
              h.update(path.relative_to(root).as_posix().encode('utf-8'))
              h.update(b'\0')
              h.update(hashlib.sha256(data).digest())
          actual = h.hexdigest()
          assert actual == expected, (actual, expected)
          print('artifact digest verified:', actual)
          PY
          git diff --check

      - name: Commit publication and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-current-sealed-once.yml
          git config user.name 'Second Brain Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Publicação do site: 2026-09-12 (rebuild atual)'
          git push origin HEAD:main
