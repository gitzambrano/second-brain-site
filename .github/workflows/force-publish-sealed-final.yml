name: Force publish sealed projection final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-publish-sealed-final.yml'

permissions:
  contents: write

concurrency:
  group: force-publish-sealed-projection-final
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover validated snapshot and promote
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -o "https://sdmntprbrazilsouth.oaiusercontent.com[^']*" .github/workflows/force-publish-sealed-once.yml | head -1)"
          test -n "$URL"
          curl --fail --location --retry 3 "$URL" --output /tmp/sealed-site-artifact.zip
          mkdir -p /tmp/export /tmp/site
          unzip -q /tmp/sealed-site-artifact.zip -d /tmp/export
          unzip -q /tmp/export/sealed-site.zip -d /tmp/site
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/site/ ./

      - name: Self-contained seal and content checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('site-manifest.json').read_text(encoding='utf-8'))
          seal = manifest.get('seal') or {}
          gates = set(seal.get('gates') or [])
          required = {'privacy', 'budget', 'pages'}
          assert required.issubset(gates), (required, gates)
          assert seal.get('artifact_digest')
          assert manifest.get('generated') == '2026-09-12'
          print('seal ok:', seal.get('sealed_at'), seal.get('artifact_digest'))
          PY
          grep -q 'Problema de autovalor' graph.html
          grep -q 'Linearização' graph.html
          grep -q 'Teorema de Stokes' graph.html
          test -s assets/cover-dark.png
          test -s assets/cover-light.png
          git diff --check

      - name: Commit publication and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/force-publish-sealed-once.yml
          rm -f .github/workflows/force-publish-sealed-retry.yml
          rm -f .github/workflows/force-publish-sealed-final.yml
          git config user.name 'Second Brain Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Publicação forçada do site: 2026-09-12'
          git push origin HEAD:main
