name: Publish sealed site once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sealed-site-once.yml"

permissions:
  contents: write

env:
  ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3578-820e-a9e0-c72f00644afe/raw?se=2026-09-13T11%3A10%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=c639806a-2bdb-5144-90ee-267f0f2aa86d&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T07%3A46%3A04Z&ske=2026-09-14T07%3A46%3A04Z&sks=b&skv=2026-02-06&sig=kbE2MK1iEIMErO9VkMkViH5GykVBIbQ/71J0EGZylOY%3D"
  ARTIFACT_SHA256: "9a82a611b898a95b595dcc8d5e2f73e05f5618e42ca1bd8d3a036ee9977b423f"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify sealed artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/public-site.zip
          echo "$ARTIFACT_SHA256  /tmp/public-site.zip" | sha256sum --check --strict
          rm -rf /tmp/public-site
          mkdir -p /tmp/public-site
          unzip -q /tmp/public-site.zip -d /tmp/public-site
          test -f /tmp/public-site/.nojekyll
          test -f /tmp/public-site/index.html
          test -f /tmp/public-site/site-manifest.json
          test -f /tmp/public-site/essays/a-fisica-da-sustentacao-uma-multidao-um-perfil-e-um-campo-de-pressao.html
          test -f /tmp/public-site/assets/a-fisica-da-sustentacao-uma-multidao-um-perfil-e-um-campo-de-pressao_fig1.svg

      - name: Publish exact sealed tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/public-site/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo "Sealed public tree already matches main."
            exit 0
          fi
          git commit -m "Publish revised lift essay"
          git push origin HEAD:main
