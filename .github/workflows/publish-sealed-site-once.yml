name: Publish sealed site once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sealed-site-once.yml"

permissions:
  contents: write

env:
  ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-01c4-820e-b813-7c7089db30d8/raw?se=2026-09-13T03%3A05%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=68bea6d8-7f8f-5b8b-a8df-0bfae5ddd62e&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T14%3A23%3A30Z&ske=2026-09-13T14%3A23%3A30Z&sks=b&skv=2026-02-06&sig=9Ja0aCXViKve1WIc5MZBpRvAmE2eJKffp/3snejVNSk%3D"
  ARTIFACT_SHA256: "abb53902d31b6150ab85e353b9cdaf0b7efb9656cadc40fb03739299e51bb1ef"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify sealed artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o /tmp/public-site.zip
          echo "$ARTIFACT_SHA256  /tmp/public-site.zip" | sha256sum --check --strict
          rm -rf /tmp/public-site
          mkdir -p /tmp/public-site
          unzip -q /tmp/public-site.zip -d /tmp/public-site
          test -f /tmp/public-site/.nojekyll
          test -f /tmp/public-site/index.html
          test -f /tmp/public-site/site-manifest.json

      - name: Publish exact sealed tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/public-site/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo "Sealed public tree already matches main."
            exit 0
          fi
          git commit -m "Publish sealed site after essay organization"
          git push origin HEAD:main
