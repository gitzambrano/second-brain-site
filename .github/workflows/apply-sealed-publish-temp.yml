name: Apply sealed publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sealed-publish-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply sealed generated site
        run: |
          set -euo pipefail
          curl --fail --location 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-171c-820e-86a3-a56ac0a88e73/raw?se=2026-09-05T18%3A53%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=0380434a-627a-52ef-868e-a8f15b533d6a&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T12%3A40%3A12Z&ske=2026-09-06T12%3A40%3A12Z&sks=b&skv=2026-02-06&sig=OItxFOpKbyH7jrr0YtE7%2B6dETh/1P0Oqu/g8I0ZuHQs%3D' -o sealed-site-patch.zip
          unzip -q sealed-site-patch.zip
          test -f PUBLISH_PATCH.diff
          git apply --check PUBLISH_PATCH.diff
          git apply --binary PUBLISH_PATCH.diff
          rm -f sealed-site-patch.zip PUBLISH_PATCH.diff
          rm -f .github/workflows/apply-sealed-publish-temp.yml

      - name: Commit and push generated site
        run: |
          set -euo pipefail
          git config user.name 'Second Brain Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git diff --cached --name-only | grep -Fx 'essays/impressao-3d-como-microcosmo-da-engenharia.html'
          git commit -m 'publish: update generated Second Brain site'
          git push origin HEAD:main
