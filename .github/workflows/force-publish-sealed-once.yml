name: Force publish sealed projection once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-publish-sealed-once.yml'

permissions:
  contents: write

concurrency:
  group: force-publish-sealed-projection
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download validated sealed snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9f28-820e-be9f-fa1560c3371a/raw?se=2026-09-12T12%3A48%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=8d4f8daa-f231-530c-8aab-f2d932aa3802&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T10%3A05%3A58Z&ske=2026-09-13T10%3A05%3A58Z&sks=b&skv=2026-02-06&sig=3Dg%2BFnBcBp%2BBelKyRDj9bvBpZHkOQmxLAWdlI4Afb9g%3D' \
            --output /tmp/sealed-site-artifact.zip
          mkdir -p /tmp/export /tmp/site
          unzip -q /tmp/sealed-site-artifact.zip -d /tmp/export
          unzip -q /tmp/export/sealed-site.zip -d /tmp/site
          echo 'Expected delta:'
          cat /tmp/export/publish-changed.txt
          test -f /tmp/site/site-manifest.json
          test -f /tmp/site/graph.html
          test -f /tmp/site/sphere.html

      - name: Promote exact sealed worktree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/site/ ./
          test ! -e .github/workflows/force-publish-sealed-once.yml

      - name: Recheck publication artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude='/_site' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='/.second-brain-site' \
            --exclude='__pycache__/' \
            ./ _site/
          python .github/scripts/check_artifact.py _site --mode artifact
          grep -q 'Problema de autovalor' graph.html
          grep -q 'Linearização' graph.html
          grep -q 'Teorema de Stokes' graph.html
          rm -rf _site

      - name: Commit forced publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Second Brain Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'Publicação forçada do site: 2026-09-12'
          git push origin HEAD:main
