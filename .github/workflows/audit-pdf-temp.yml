name: Temporary PDF visual audit

on:
  push:
    branches:
      - audit/pdf-visual-2026-09-10

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pdf-visual-2026-09-10
          path: site
          fetch-depth: 2

      - name: Snapshot public engine
        run: |
          git clone --depth 1 https://github.com/gitzambrano/second-brain-engine.git engine
          mkdir -p audit-src/engine audit-src/site
          rsync -a --exclude=.git engine/ audit-src/engine/
          rsync -a --exclude=.git site/ audit-src/site/
          printf 'site_commit=' > audit-src/versions.txt
          git -C site rev-parse HEAD >> audit-src/versions.txt
          printf 'engine_commit=' >> audit-src/versions.txt
          git -C engine rev-parse HEAD >> audit-src/versions.txt

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Generate PDFs and structural audit
        working-directory: site
        run: |
          mkdir -p ../audit-out/pdfs ../audit-out/screenshots
          python -m http.server 8765 >/tmp/sb-http.log 2>&1 &
          echo $! >/tmp/sb-http.pid
          sleep 2
          cat > /tmp/render.py <<'PY'
          import asyncio, json, pathlib, traceback
          from playwright.async_api import async_playwright

          ROOT = pathlib.Path.cwd()
          OUT = ROOT.parent / 'audit-out'
          essays = sorted((ROOT / 'essays').glob('*.html'))

          async def audit_page(page, url):
              console_errors = []
              page.on('console', lambda m: console_errors.append(m.text) if m.type == 'error' else None)
              await page.goto(url, wait_until='domcontentloaded', timeout=30000)
              await page.wait_for_timeout(300)
              data = await page.evaluate('''() => {
                const hs = [...document.querySelectorAll('h1,h2,h3,h4')].map(h => ({tag:h.tagName.toLowerCase(), text:h.innerText.trim()}));
                let last = 0, jumps = [];
                for (const h of hs) {
                  const n = Number(h.tagName[1]);
                  if (last && n > last + 1) jumps.push(`${last}->${n}: ${h.text}`);
                  last = n;
                }
                const brokenImages = [...document.images].filter(i => !i.complete || i.naturalWidth === 0).map(i => i.getAttribute('src'));
                const overflow = [...document.querySelectorAll('body *')].filter(el => {
                  const r = el.getBoundingClientRect();
                  return r.width > 0 && (r.right > innerWidth + 2 || r.left < -2);
                }).slice(0,20).map(el => ({tag:el.tagName.toLowerCase(), cls:el.className || '', text:(el.innerText||'').trim().slice(0,80)}));
                return {
                  title: document.title,
                  headings: hs,
                  heading_jumps: jumps,
                  h1_count: document.querySelectorAll('h1').length,
                  h2_count: document.querySelectorAll('h2').length,
                  h3_count: document.querySelectorAll('h3').length,
                  h4_count: document.querySelectorAll('h4').length,
                  strong_count: document.querySelectorAll('strong,b').length,
                  blockquote_count: document.querySelectorAll('blockquote').length,
                  callout_count: document.querySelectorAll('.callout,[class*="callout"],aside').length,
                  broken_images: brokenImages,
                  horizontal_overflow: document.documentElement.scrollWidth > innerWidth + 2,
                  overflow_elements: overflow
                };
              }''')
              data['console_errors'] = console_errors
              return data

          async def shot(page, url, name, theme=None):
              await page.goto(url, wait_until='domcontentloaded', timeout=30000)
              if theme:
                  await page.evaluate('(t) => { localStorage.setItem("sb-theme", t); document.documentElement.dataset.theme=t; }', theme)
                  await page.wait_for_timeout(150)
              await page.screenshot(path=str(OUT/'screenshots'/name), full_page=False, timeout=15000)

          async def main():
              report = {'essay_count': len(essays), 'essays': {}, 'errors': []}
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={'width': 1440, 'height': 1000}, device_scale_factor=1)
                  for html in essays:
                      slug = html.stem
                      url = f'http://127.0.0.1:8765/essays/{html.name}'
                      try:
                          report['essays'][slug] = await audit_page(page, url)
                          await page.emulate_media(media='print')
                          await page.pdf(path=str(OUT/'pdfs'/f'{slug}.pdf'), format='A4', print_background=True,
                                         margin={'top':'14mm','right':'13mm','bottom':'14mm','left':'13mm'})
                          await page.emulate_media(media='screen')
                      except Exception as e:
                          report['errors'].append({'slug': slug, 'error': repr(e), 'trace': traceback.format_exc()[-2000:]})

                  # Fixed-viewport screenshots: local and actual published site, light/dark.
                  targets = [
                    ('local-home', 'http://127.0.0.1:8765/'),
                    ('live-home', 'https://gitzambrano.github.io/second-brain-site/'),
                    ('local-essay', f'http://127.0.0.1:8765/essays/{essays[0].name}'),
                    ('live-essay', f'https://gitzambrano.github.io/second-brain-site/essays/{essays[0].name}')
                  ]
                  for prefix, url in targets:
                      for theme in ('light','dark'):
                          try:
                              await shot(page, url, f'{prefix}-{theme}.png', theme)
                          except Exception as e:
                              report['errors'].append({'screenshot': f'{prefix}-{theme}', 'error': repr(e)})

                  mobile = await browser.new_page(viewport={'width':390,'height':844}, device_scale_factor=1)
                  for prefix, url in [('live-home-mobile','https://gitzambrano.github.io/second-brain-site/'),
                                      ('live-essay-mobile',f'https://gitzambrano.github.io/second-brain-site/essays/{essays[0].name}')]:
                      for theme in ('light','dark'):
                          try:
                              await shot(mobile, url, f'{prefix}-{theme}.png', theme)
                          except Exception as e:
                              report['errors'].append({'screenshot': f'{prefix}-{theme}', 'error': repr(e)})
                  await mobile.close()
                  await browser.close()
              (OUT/'dom-audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')

          asyncio.run(main())
          PY
          python /tmp/render.py
          kill $(cat /tmp/sb-http.pid) || true
          test "$(find ../audit-out/pdfs -name '*.pdf' | wc -l)" -eq 44

      - name: Upload audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-visual-audit
          path: |
            audit-out
            audit-src
          retention-days: 1
          compression-level: 6

      - name: Remove temporary workflow from branch
        if: always()
        working-directory: site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/audit-pdf-temp.yml
          git commit -m 'chore(audit): remove temporary workflow [skip ci]'
          git push origin HEAD:audit/pdf-visual-2026-09-10
