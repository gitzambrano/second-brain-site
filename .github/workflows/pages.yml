name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O conteúdo chega pronto do engine, que já valida a privacidade na
      # origem. Publicar na internet mesmo assim sem olhar seria confiar em
      # quem empurrou o commit. A portaria é auto-suficiente: biblioteca
      # padrão, só os arquivos deste repositório, sem acesso ao repo privado.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate — allowlist, vazamento e orçamento
        run: python .github/scripts/check_artifact.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
