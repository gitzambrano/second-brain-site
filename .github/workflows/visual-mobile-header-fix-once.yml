name: Visual mobile header fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-mobile-header-fix-once.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual audit tools
        run: |
          python -m pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture before, apply fix, capture after
        run: python .github/scripts/apply_visual_header_fix.py
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: visual-mobile-header-audit
          path: visual-audit
          retention-days: 1
      - name: Validate generated site syntax
        run: |
          grep -q 'const LABEL_SHOW_AT = 1.16;' graph.html
          grep -q 'const LABEL_HIDE_AT = 1.10;' graph.html
          grep -q 'font-size: 1.28rem' assets/site.css
          grep -q 'sb-nav #sbTheme > span' essays/dinamica-analitica-e-acoplamento-fisico-do-modo-dutch-roll.html
          git diff --check
      - name: Commit directly to main and clean helpers
        run: |
          git config user.name "second-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/visual-mobile-header-fix-once.yml .github/scripts/apply_visual_header_fix.py
          rm -rf visual-audit
          git add assets/site.css graph.html essays
          git diff --cached --check
          git commit -m "Fix mobile essay header visual parity"
          git push origin HEAD:main
