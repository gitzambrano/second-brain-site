name: Publish sealed site artifact once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sealed-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download sealed artifact
        shell: bash
        run: |
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9ab4-820e-8c0b-a255af9f033c/raw?se=2026-09-12T20%3A04%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=c5a60c3c-c629-5a70-9204-3892a617bcd2&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T11%3A57%3A25Z&ske=2026-09-13T11%3A57%3A25Z&sks=b&skv=2026-02-06&sig=DO4q30Bc/NJ2Yf6//3FVGwwEkCUeyKIpVPRofntUMc4%3D' -o /tmp/site.zip
          echo 'ac62c11993eeae7406d37afe7d52e065c2c16167a107ea8e4eeb032675b2256e  /tmp/site.zip' | sha256sum -c -
          mkdir -p /tmp/sealed-site
          unzip -q /tmp/site.zip -d /tmp/sealed-site
          test -f /tmp/sealed-site/.second-brain-site
          test -f /tmp/sealed-site/site-manifest.json

      - name: Replace repository with sealed artifact
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/sealed-site/ ./
          git status --short

      - name: Commit and push publication
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No site changes to publish.'
          else
            git commit -m 'Publicação do site: 2026-09-12'
            git push origin HEAD:main
          fi
